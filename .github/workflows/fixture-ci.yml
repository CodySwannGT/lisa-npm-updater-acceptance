name: Safe fixture CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native dependency behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
      - name: Install the declared npm version
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - name: Install the locked safe fixture without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise the native dependency
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify manifest and lock remained unchanged
        run: git diff --exit-code -- package.json package-lock.json

  traceability:
    name: Canonical Work-Item traceability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
      - name: Validate the complete real PR range, body and managed backlink
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          LISA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LISA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LISA_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node ../trusted/scripts/lisa-work-item.mjs validate-pr
